server:
  port: 8080

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://localhost:3306/booking
    username: booking
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
