server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/inventory/**

            - id: booking-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/booking


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8091/realms/booking-realm"

keycloak:
  auth:
    jwk-set-uri: "http://localhost:8091/realms/booking-realm/protocol/openid-connect/certs"


management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-detail: always
  endpoints:
    web:
      exposure:
        include: *

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 8
        failure-rate-threshold: 50
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s

